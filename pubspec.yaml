name: academia
description: Projet Flutter avec intégration Supabase automatisée
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  
  # Supabase - Configuration validée
  supabase_flutter: ^1.10.24
  
  # HTTP pour les appels RPC validés
  http: ^1.1.0
  
  # State management
  provider: ^6.1.1
  
  # Navigation
  go_router: ^12.1.3
  
  # UI
  cupertino_icons: ^1.0.2
  flutter_svg: ^2.0.9
  
  # Local storage
  shared_preferences: ^2.2.2
  
  # Utils
  intl: ^0.18.1
  url_launcher: ^6.2.5
  
  # Gaming Engine - Flame et composants
  flame: ^1.10.1
  flame_behaviors: ^0.2.0
  flame_audio: ^2.1.2
  
  # Gaming Services (Leaderboards, Achievements)
  games_services: ^4.0.0
  
  # Multiplayer et temps réel
  web_socket_channel: ^2.4.0
  
  # Animations gaming
  simple_animations: ^5.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/
    - assets/bobodo/
    - assets/games/images/
    - assets/games/sounds/
    - assets/games/ui/
