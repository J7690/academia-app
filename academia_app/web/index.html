<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="academia_app">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>academia_app</title>
  <link rel="manifest" href="manifest.json">

  <script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.12/hls.min.js"></script>
  <script>
    window.createHlsVideo = function(video, url, autoplay, loop, muted) {
      if (!video) return;

      console.log('[HLS] createHlsVideo url=', url,
        ' autoplay=', autoplay, ' loop=', loop, ' muted=', muted);

      // Prépare une transition douce à l'entrée de la nouvelle vidéo.
      if (!video.style.transition) {
        video.style.transition = 'opacity 0.6s ease-in-out';
      }

      if (video.hlsInstance && typeof video.hlsInstance.destroy === 'function') {
        console.log('[HLS] destroying previous hlsInstance');
        video.hlsInstance.destroy();
        video.hlsInstance = null;
      }

      video.addEventListener('error', function() {
        console.error('[HLS] video element error', video.error);
      });

      video.addEventListener('loadedmetadata', function() {
        console.log('[HLS] loadedmetadata duration=', video.duration);
      });

      function setupAndPlay() {
        video.autoplay = !!autoplay;
        video.loop = !!loop;
        video.muted = !!muted;
        console.log('[HLS] setupAndPlay autoplay=', video.autoplay,
          ' loop=', video.loop, ' muted=', video.muted);
        if (autoplay) {
          var p = video.play();
          if (p && p.catch) {
            p.catch(function(err) {
              console.warn('[HLS] video.play() rejected', err);
            });
          }
        }
        // Quand la vidéo est prête à jouer, on l’affiche en fondu.
        video.style.opacity = '1';
      }

      var canPlayNative = '';
      if (video.canPlayType) {
        canPlayNative = video.canPlayType('application/vnd.apple.mpegurl');
      }
      console.log('[HLS] canPlayType("application/vnd.apple.mpegurl") =', canPlayNative);

      if (canPlayNative === 'probably' || canPlayNative === 'maybe') {
        console.log('[HLS] Using native HLS support');
        video.src = url;
        setupAndPlay();
        return;
      }

      if (window.Hls) {
        console.log('[HLS] Using hls.js, version=', window.Hls.version);
        var hls = new Hls();
        video.hlsInstance = hls;
        hls.loadSource(url);
        hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED, function() {
          console.log('[HLS] MANIFEST_PARSED, starting playback');
          setupAndPlay();
        });
        hls.on(Hls.Events.ERROR, function(event, data) {
          console.error('[HLS] Hls error', data);
        });
      } else {
        console.log('[HLS] window.Hls not present, fallback to direct src');
        video.src = url;
        setupAndPlay();
      }
    };
  </script>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
