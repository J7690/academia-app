name: academia_app
description: Projet Flutter avec intégration Supabase automatisée
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  
  # Supabase - Configuration validée
  supabase_flutter: ^2.10.3
  sign_in_with_apple: ^7.0.1
  
  # Notifications push (Firebase FCM)
  firebase_core: ^3.7.0
  firebase_messaging: ^15.1.3
  
  # HTTP pour les appels RPC validés
  http: ^1.1.0
  
  # State management
  provider: ^6.1.1
  
  # Navigation
  go_router: ^12.1.3
  
  # UI
  cupertino_icons: ^1.0.2
  flutter_svg: ^2.0.9
  
  # Sélection de fichiers (upload de documents de candidature)
  file_picker: ^10.3.6
  
  # Local storage
  shared_preferences: ^2.2.2
  
  # Utils
  intl: ^0.18.1

  url_launcher: ^6.2.5

  video_player: ^2.10.1

  camera: ^0.11.0+1

  livekit_client: ^2.5.4

  image_picker: ^1.0.7

  share_plus: ^7.2.1

  ar_flutter_plugin: ^0.7.3

  academia_universal_video_player:
    path: ../packages/academia_universal_video_player

  pdf: ^3.10.4
  printing: ^5.11.0

  record: ^6.1.2

  audioplayers: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  
  assets:
    - assets/
    - assets/images/
    - assets/icons/

flutter_launcher_icons:
  image_path: "assets/Academia.0.png"
  android: true
  ios: true
  min_sdk_android: 21
  adaptive_icon_background: "#7BC96F"
  adaptive_icon_foreground: "assets/Academia.0.png"
