[build]
  command = "bash ./netlify/flutter.sh"
  publish = "academia_app/build/web"

[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"
    Expires = "0"

# Redirection des liens de parrainage vers Supabase Edge Function
[[redirects]]
  from = "/ref/*"
  to = "https://thevdfcwlcqzdoybfvgs.supabase.co/functions/v1/referral-redirect/ref/:splat"
  status = 302
  force = true
