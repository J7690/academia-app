name: academia_app
description: Projet Flutter avec intégration Supabase automatisée
publish_to: 'none'

version: 1.0.0+24

environment:
  sdk: '>=3.2.0 <4.0.0'
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  
  # Supabase - Configuration validée
  supabase_flutter: ^2.10.3
  sign_in_with_apple: ^7.0.1
  
  # Firebase - Latest compatible versions (BoM 4.10.0)
  firebase_core: ^4.5.0
  firebase_messaging: ^16.1.2
  firebase_crashlytics: ^5.0.8
  flutter_local_notifications: ^18.0.1
  
  # HTTP pour les appels RPC validés
  http: ^1.1.0

  path_provider: ^2.1.2
  saver_gallery: ^4.1.0
  
  # State management
  provider: ^6.1.1
  
  # Navigation
  go_router: ^12.1.3
  
  # UI - Updated versions
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.11
  animate_do: ^4.2.0
  
  # Sélection de fichiers (upload de documents de candidature)
  file_picker: ^10.3.6
  
  # Local storage
  shared_preferences: ^2.2.2
  
  # Utils
  intl: ^0.20.2
  
  # Install Referrer API (Play Store attribution)
  play_install_referrer: ^0.5.0

  url_launcher: ^6.2.5

  video_player: ^2.10.1

  livekit_client: ^2.6.0

  # Deja present comme dependance transitive de livekit_client, declare ici
  # explicitement pour utiliser `Helper.requestCapturePermission()`.
  # Sur Android 14+, l'autorisation de capture doit etre obtenue AVANT de
  # demarrer le service de premier plan : l'ordre inverse fait fermer
  # l'application (SecurityException). Voir screen_share_service.dart.
  flutter_webrtc: ^1.3.0

  # Service de premier plan Android hebergeant la capture d'ecran.
  # Obligatoire depuis Android 14 : sans service de type mediaProjection,
  # MediaProjection leve une SecurityException et l'application se ferme.
  # Utilise uniquement pendant un partage d'ecran, jamais en tache de fond.
  flutter_background: ^1.3.0

  image_picker: ^1.0.7

  share_plus: ^10.0.3

  # ar_flutter_plugin retire temporairement : ses .so AR (Sceneform, abandonne)
  # ne sont pas alignes 16 Ko (exigence Play Android 15+). Ecrans AR remplaces
  # par un message "bientot disponible". A reintegrer via io.github.sceneview 2.x.
  # ar_flutter_plugin: ^0.7.3

  academia_universal_video_player:
    path: ../packages/academia_universal_video_player

  pdf: ^3.10.4
  printing: ^5.11.0

  record: ^6.1.2

  audioplayers: ^6.0.0

  # Bobodo Vocal
  flutter_sound: ^9.2.13
  just_audio: ^0.9.36
  permission_handler: ^11.3.1
  flutter_tts: ^3.8.5
  speech_to_text: ^7.0.0

  # Prep concours module
  fl_chart: ^0.69.2
  flip_card: ^0.7.0
  flutter_markdown: ^0.7.6+2

  # Bobodo assistant chat
  emoji_picker_flutter: ^3.1.0
  shimmer: ^3.0.0

  # Community social features - Updated
  cached_network_image: ^3.4.1
  image_cropper: ^8.1.0
  story_view: ^0.16.5

  # Marketplace UI — Amazon/Alibaba style
  smooth_page_indicator: ^1.2.0+1
  flutter_staggered_grid_view: ^0.7.0
  photo_view: ^0.15.0
  readmore: ^3.0.0
  flutter_rating_bar: ^4.0.1

  # Math/Science input & rendering
  math_keyboard: ^0.3.0
  flutter_math_fork: ^0.7.2
  gpt_markdown: ^1.1.5

  # Challenge TikTok Studio
  easy_video_editor: ^0.1.3
  perfect_freehand: ^2.0.0
  pro_video_editor: ^1.6.1
  ffmpeg_kit_flutter_new_audio: ^2.0.0

  # Video optimisation (compression, cache, thumbnails)
  video_compress: ^3.1.3
  cached_video_player_plus: ^4.1.0
  video_thumbnail: ^0.5.6
  tiktoklikescroller: ^0.2.8

  # Gaming Engine - Latest stable
  flame: ^1.35.1
  
  # Live Streaming & Recording
  web_socket_channel: ^2.4.0
  
  # UI Premium
  lottie: ^3.1.0
  
  # Social Sharing
  
  # Media Processing
  
  # File Management
  
  # Monétisation
  in_app_purchase: ^3.1.9
  
  # Mobile First - Updated versions
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  sqflite: ^2.4.2
  flutter_secure_storage: ^9.2.4
  device_info_plus: ^12.3.0
  package_info_plus: ^9.0.0
  connectivity_plus: ^7.0.0
  crypto: ^3.0.7
  uuid: ^4.5.2

  # Machine Learning - Latest compatible
  tflite_flutter: ^0.12.1
  image: ^4.5.4
  camera: ^0.11.0
  path: ^1.9.1
  
  # Production & Monitoring - Updated compatible versions
  sentry_flutter: ^8.8.0
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7
  dio: ^5.9.2
  phone_numbers_parser: ^9.0.25

dependency_overrides:
  # ar_flutter_plugin retire temporairement (voir dependencies ci-dessus).
  # ar_flutter_plugin:
  #   path: ../packages/ar_flutter_plugin
  supabase: 2.10.0
  supabase_flutter: 2.10.3
  app_links: 6.4.1
  gotrue: 2.16.0
  postgrest: 2.5.0
  realtime_client: 2.6.0
  storage_client: 2.4.1
  functions_client: 2.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  
  assets:
    - assets/
    - assets/images/
    - assets/icons/
    - assets/audio/
    - assets/data/

flutter_launcher_icons:
  image_path: "assets/Academia.0.png"
  android: true
  ios: true
  min_sdk_android: 21
  adaptive_icon_background: "#7BC96F"
  adaptive_icon_foreground: "assets/Academia.0.png"
