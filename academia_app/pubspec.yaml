name: academia_app
description: Projet Flutter avec intégration Supabase automatisée
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  
  # Supabase - Configuration validée
  supabase_flutter: ^2.10.3
  sign_in_with_apple: ^7.0.1
  
  # HTTP pour les appels RPC validés
  http: ^1.1.0
  
  # State management
  provider: ^6.1.1
  
  # Navigation
  go_router: ^12.1.3
  
  # UI
  cupertino_icons: ^1.0.2
  
  # Sélection de fichiers (upload de documents de candidature)
  file_picker: ^10.3.6
  
  # Local storage
  shared_preferences: ^2.2.2
  
  # Utils
  intl: ^0.18.1

  url_launcher: ^6.2.5

  video_player: ^2.10.1

  camera: ^0.11.0+1

  livekit_client: ^2.5.4

  image_picker: ^1.0.7

  share_plus: ^7.2.1

  ar_flutter_plugin: ^0.7.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/
