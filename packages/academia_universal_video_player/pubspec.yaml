name: academia_universal_video_player
description: Plugin Android pour lecture vidéo universelle avec fallback logiciel (ExoPlayer)
version: 0.1.0
publish_to: 'none'

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: com.academia.universal_video_player
        pluginClass: UniversalVideoPlayerPlugin
