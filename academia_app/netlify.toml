[build]
  publish = "build/web"
  command = "flutter build web --release"

[build.environment]
  TZ = "UTC"

# Domaine canonique (B3) : www.app -> app
# Exception : /.well-known/ (assetlinks.json) reste servi sur www.
[[redirects]]
  from = "https://www.app.academiea.com/.well-known/*"
  to = "/.well-known/:splat"
  status = 200

[[redirects]]
  from = "https://www.app.academiea.com/*"
  to = "https://app.academiea.com/:splat"
  status = 301
  force = true

# Redirection des liens de parrainage vers Supabase Edge Function
[[redirects]]
  from = "/ref/*"
  to = "https://thevdfcwlcqzdoybfvgs.supabase.co/functions/v1/referral-redirect/ref/:splat"
  status = 302
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
