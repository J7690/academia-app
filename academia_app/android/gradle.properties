# MEMOIRE DU DEMON GRADLE : 3 Go ne suffisent pas a une compilation a froid.
#
# Mesure du 10/09/2026. Apres avoir vide les caches Gradle pour liberer le
# disque, la compilation a echoue sur :
#
#   Execution failed for JetifyTransform: ...io.flutter/arm64_v8a_debug...jar
#      > Java heap space
#
# Jetifier reecrit CHAQUE archive pour la porter vers AndroidX. Tant que les
# transformations sont en cache, il n'en refait aucune et 3 Go passent. A
# froid, il les refait toutes dans le meme demon, et 3 Go ne passent plus.
# C'est donc un reglage qui ne se voyait que le jour ou le cache disparait --
# et sur ce poste, le cache disparait chaque fois que le disque sature.
#
# 6 Go sur les 23,8 Go de la machine reste conservateur. Si un jour
# `android.enableJetifier` est retire (a verifier : plus aucune dependance ne
# devrait tirer `com.android.support`), ce besoin retombera de lui-meme.
org.gradle.jvmargs=-Xmx6G -Dfile.encoding=UTF-8 -XX:+HeapDumpOnOutOfMemoryError -Dhttp.connectionTimeout=180000 -Dhttp.socketTimeout=180000 -Dorg.gradle.internal.http.connectionTimeout=180000 -Dorg.gradle.internal.http.socketTimeout=180000
android.useAndroidX=true
android.enableJetifier=true

# Kotlin configuration
kotlin_version=2.1.0

# LECTEUR DE QR : variante NON EMBARQUEE du modele MLKit (10/09/2026).
#
# `mobile_scanner` propose deux variantes. Par defaut il EMBARQUE le modele de
# lecture de codes-barres, ce qui ajoute plusieurs megaoctets de bibliotheques
# natives au paquet. La variante ci-dessous telecharge le modele au premier
# usage via les services Google Play : environ 600 Ko de plus, et surtout
# BEAUCOUP MOINS DE `.so` DANS L'APK.
#
# Pourquoi cela compte ici. `ar_flutter_plugin` a du etre retire de ce projet
# parce que ses bibliotheques natives n'etaient pas alignees sur 16 Ko, exigence
# de Play depuis Android 15. Chaque `.so` ajoute est un risque de ce type ;
# celui qu'on n'embarque pas ne peut pas echouer.
#
# Le compromis est nul en pratique : verifier un bon exige de toute facon le
# reseau, puisque c'est le serveur qui repond.
dev.steenbakker.mobile_scanner.useUnbundled=true
