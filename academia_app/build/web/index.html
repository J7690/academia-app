<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Academia">
  <link rel="apple-touch-icon" href="assets/ACADEMIA_logo1.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="assets/ACADEMIA_logo1.png"/>

  <title>Academia – by Nexium Group</title>
  <link rel="manifest" href="manifest.json">

  <style>
    #loader {
      position: fixed;
      inset: 0;
      background: linear-gradient(135deg, #7bc96f, #e8f5e9);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      color: #1b5e20;
      z-index: 9999;
    }

    .loader-logo {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: 0.04em;
      margin-bottom: 16px;
    }

    .loader-subtitle {
      font-size: 14px;
      opacity: 0.9;
      margin-bottom: 24px;
    }

    .loader-spinner {
      width: 36px;
      height: 36px;
      border: 4px solid #c8e6c9;
      border-top-color: #2e7d32;
      border-radius: 50%;
      animation: loader-spin 1s linear infinite;
      margin-bottom: 12px;
    }

    .loader-text {
      font-size: 13px;
      opacity: 0.85;
    }

    @keyframes loader-spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.12/hls.min.js"></script>
  <script>
    window.createHlsVideo = function(video, url, autoplay, loop, muted) {
      if (!video) return;

      console.log('[HLS] createHlsVideo url=', url,
        ' autoplay=', autoplay, ' loop=', loop, ' muted=', muted);

      // Prépare une transition douce à l'entrée de la nouvelle vidéo.
      if (!video.style.transition) {
        video.style.transition = 'opacity 0.6s ease-in-out';
      }

      if (video.hlsInstance && typeof video.hlsInstance.destroy === 'function') {
        console.log('[HLS] destroying previous hlsInstance');
        video.hlsInstance.destroy();
        video.hlsInstance = null;
      }

      video.addEventListener('error', function() {
        console.error('[HLS] video element error', video.error);
      });

      video.addEventListener('loadedmetadata', function() {
        console.log('[HLS] loadedmetadata duration=', video.duration);
      });

      function setupAndPlay() {
        video.autoplay = !!autoplay;
        video.loop = !!loop;
        video.muted = !!muted;
        console.log('[HLS] setupAndPlay autoplay=', video.autoplay,
          ' loop=', video.loop, ' muted=', video.muted);
        if (autoplay) {
          var p = video.play();
          if (p && p.catch) {
            p.catch(function(err) {
              console.warn('[HLS] video.play() rejected', err);
            });
          }
        }
        // Quand la vidéo est prête à jouer, on l’affiche en fondu.
        video.style.opacity = '1';
      }

      var canPlayNative = '';
      if (video.canPlayType) {
        canPlayNative = video.canPlayType('application/vnd.apple.mpegurl');
      }
      console.log('[HLS] canPlayType("application/vnd.apple.mpegurl") =', canPlayNative);

      if (canPlayNative === 'probably' || canPlayNative === 'maybe') {
        console.log('[HLS] Using native HLS support');
        video.src = url;
        setupAndPlay();
        return;
      }

      if (window.Hls) {
        console.log('[HLS] Using hls.js, version=', window.Hls.version);
        var hls = new Hls();
        video.hlsInstance = hls;
        hls.loadSource(url);
        hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED, function() {
          console.log('[HLS] MANIFEST_PARSED, starting playback');
          setupAndPlay();
        });
        hls.on(Hls.Events.ERROR, function(event, data) {
          console.error('[HLS] Hls error', data);
        });
      } else {
        console.log('[HLS] window.Hls not present, fallback to direct src');
        video.src = url;
        setupAndPlay();
      }
    };
  </script>
</head>
<body>
  <div id="loader">
    <div class="loader-logo">Academia</div>
    <div class="loader-subtitle">Plateforme d'orientation & admissions</div>
    <div class="loader-spinner"></div>
    <div class="loader-text">Préparation de votre espace étudiant…</div>
  </div>

  <script>
    window.addEventListener('flutter-first-frame', function () {
      var loader = document.getElementById('loader');
      if (loader) {
        loader.remove();
      }
    });
  </script>
  <script>
    // Enregistre le service worker Firebase Messaging pour les notifications web.
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker
          .register('firebase-messaging-sw.js')
          .then(function (registration) {
            console.log(
              '[Academia] Firebase Messaging service worker registered with scope:',
              registration.scope
            );
          })
          .catch(function (err) {
            console.error('[Academia] Firebase Messaging service worker registration failed:', err);
          });
      });
    }
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
